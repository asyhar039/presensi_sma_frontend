<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Siswa - Presensi Mandiri</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 10% 20%, rgb(6, 11, 38) 0%, rgb(16, 22, 54) 90.1%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --neon-indigo: #6366f1;
            --neon-purple: #a855f7;
            --neon-emerald: #10b981;
        }
        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            padding-bottom: 40px;
        }
        .portal-header {
            background: rgba(99, 102, 241, 0.1);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 0;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--neon-indigo) 0%, var(--neon-purple) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
        }
        .stat-val { font-size: 24px; font-weight: 800; }
        .stat-lbl { font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        #reader { width: 100%; border-radius: 16px; overflow: hidden; background: #000; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="portal-header">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <div class="brand-logo"><i class="fas fa-graduation-cap"></i></div>
                <div>
                    <h5 class="fw-bold m-0 text-white">PORTAL SISWA</h5>
                    <span style="font-size: 11px; color: #94a3b8;">SMA NEGERI PRESENSI</span>
                </div>
            </div>
            <div id="student-header-info" class="d-none">
                <span class="fw-bold me-2" id="student-name-display">Nama Siswa</span>
                <button id="btn-student-logout" class="btn btn-sm btn-outline-danger rounded-pill">Keluar</button>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 900px;">
        <!-- LOGIN STATE -->
        <div id="student-login-card" class="glass-card mx-auto" style="max-width: 440px;">
            <div class="text-center mb-4">
                <div class="brand-logo mx-auto mb-3" style="width: 54px; height: 54px; font-size: 24px;">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h4 class="fw-bold">Verifikasi Siswa</h4>
                <p class="text-muted small">Masuk menggunakan Nama Lengkap dan NISN</p>
            </div>

            <div id="student-login-alert" class="alert alert-danger d-none mb-3"></div>

            <form id="form-student-login">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Nama Lengkap (Username)</label>
                    <input type="text" id="stud-username" class="form-control bg-dark text-white border-secondary" placeholder="Contoh: Ahmad Fauzi" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small fw-semibold">Nomor NISN (Password)</label>
                    <input type="password" id="stud-password" class="form-control bg-dark text-white border-secondary" placeholder="Masukkan NISN" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-bold">Masuk Portal Siswa</button>
            </form>
        </div>

        <!-- LOGGED IN STATE -->
        <div id="student-dashboard" class="d-none">
            <!-- Digital Clock & Info -->
            <div class="glass-card text-center mb-4">
                <div class="fs-1 fw-bold text-white mb-1" id="clock-display">00:00:00</div>
                <div class="text-muted small" id="date-display">Memuat tanggal...</div>
            </div>

            <!-- Stats -->
            <div class="row g-3 mb-4">
                <div class="col-3"><div class="stat-box"><div class="stat-val text-success" id="stat-hadir">0</div><div class="stat-lbl">Hadir</div></div></div>
                <div class="col-3"><div class="stat-box"><div class="stat-val text-info" id="stat-izin">0</div><div class="stat-lbl">Izin</div></div></div>
                <div class="col-3"><div class="stat-box"><div class="stat-val text-warning" id="stat-sakit">0</div><div class="stat-lbl">Sakit</div></div></div>
                <div class="col-3"><div class="stat-box"><div class="stat-val text-danger" id="stat-alfa">0</div><div class="stat-lbl">Alfa</div></div></div>
            </div>

            <!-- QR Scanner Box -->
            <div class="glass-card mb-4">
                <h5 class="fw-bold mb-3"><i class="fas fa-camera text-primary me-2"></i> Pemindai Presensi QR Code</h5>
                <div id="reader"></div>
                <div id="scan-result" class="alert d-none mt-3"></div>
            </div>

            <!-- History -->
            <div class="glass-card">
                <h5 class="fw-bold mb-3"><i class="fas fa-history text-primary me-2"></i> Riwayat Kehadiran Terbaru</h5>
                <div id="history-container" class="table-responsive"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/student.js"></script>
</body>
</html>
