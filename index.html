<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi SMA - Single Page App</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

    <!-- LOGIN SCREEN OVERLAY -->
    <div id="login-screen" class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); z-index: 9999;">
        <div class="card border-0 shadow-lg p-4" style="width: 100%; max-width: 420px; border-radius: 20px;">
            <div class="text-center mb-4">
                <div class="mx-auto mb-3 text-primary d-flex align-items-center justify-content-center rounded-circle" style="width: 64px; height: 64px; background: rgba(99, 102, 241, 0.1); font-size: 32px;">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h4 class="fw-bold text-dark">ABSENSI SMA</h4>
                <p class="text-muted small">Portal Utama Admin & Guru</p>
            </div>

            <div id="login-alert" class="alert alert-danger d-none mb-3"></div>

            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" id="login-username" class="form-control form-control-lg fs-6" placeholder="Masukkan username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" id="login-password" class="form-control form-control-lg fs-6" placeholder="Masukkan password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold fs-6 py-2.5 rounded-3">
                    <i class="fas fa-sign-in-alt me-2"></i> Masuk Sekarang
                </button>
            </form>

            <div class="mt-4 p-3 bg-light rounded-3 text-muted small">
                <strong>Credential Demo:</strong><br>
                • Admin: <code>admin</code> / <code>admin123</code><br>
                • Guru: <code>guru</code> / <code>guru123</code>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="app-container" id="app-wrapper">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
                <div class="brand-text">ABSENSI SMA</div>
            </div>
            <nav>
                <a href="#dashboard" class="nav-link active" data-view="dashboard"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></a>
                <a href="#siswa" class="nav-link" data-view="siswa"><i class="fas fa-user-graduate"></i> <span>Data Siswa</span></a>
                <a href="#guru" class="nav-link" data-view="guru"><i class="fas fa-chalkboard-teacher"></i> <span>Data Guru</span></a>
                <a href="#kelas" class="nav-link" data-view="kelas"><i class="fas fa-school"></i> <span>Data Kelas</span></a>
                <a href="#mapel" class="nav-link" data-view="mapel"><i class="fas fa-book-open"></i> <span>Mata Pelajaran</span></a>
                <a href="#jadwal" class="nav-link" data-view="jadwal"><i class="fas fa-calendar-alt"></i> <span>Jadwal Pelajaran</span></a>
                <a href="#absensi" class="nav-link" data-view="absensi"><i class="fas fa-clipboard-check"></i> <span>Input Absensi</span></a>
                <a href="#laporan" class="nav-link" data-view="laporan"><i class="fas fa-file-invoice"></i> <span>Laporan Absensi</span></a>
                <hr style="border-color: rgba(255,255,255,0.2);">
                <a href="javascript:void(0)" id="btn-logout" class="nav-link text-warning"><i class="fas fa-sign-out-alt"></i> <span>Keluar</span></a>
            </nav>
        </div>

        <!-- MAIN CONTENT AREA -->
        <div class="main-content">
            <!-- TOPBAR -->
            <div class="topbar">
                <div class="topbar-title">
                    <h4 id="page-title">Dashboard</h4>
                </div>
                <div class="topbar-user">
                    <div class="avatar" id="user-avatar">A</div>
                    <div>
                        <div class="fw-bold small text-dark" id="user-fullname">Administrator</div>
                        <div class="text-muted" style="font-size: 11px;" id="user-role">Role: Admin</div>
                    </div>
                </div>
            </div>

            <!-- DYNAMIC VIEW CONTAINER -->
            <div id="view-container">
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border text-primary me-2"></div> Memuat aplikasi...
                </div>
            </div>
        </div>
    </div>

    <!-- GLOBAL MODAL CONTAINER -->
    <div class="modal fade" id="app-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" id="modal-dialog-size">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modal-title">Form Data</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4" id="modal-body">
                    <!-- Form Content Injected Dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="assets/js/config.js?v=2"></script>
    <script src="assets/js/api.js?v=2"></script>
    <script src="assets/js/app.js?v=2"></script>
</body>
</html>
